name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  # Match production exactly. The modem's kernel breaks stock crypto/rand, so we
  # build with a patched standard library via `go build -overlay` (see
  # toolchain/mkoverlay and toolchain_guard.go). GOTOOLCHAIN=local pins the Go
  # provided by setup-go; the overlay's text anchors are tied to that version.
  GOTOOLCHAIN: local
  # -overlay patches the stdlib; -tags patchedstdlib disables the build guard that
  # otherwise fails the build on Go >= 1.24 (which would die on the device).
  PATCHFLAGS: -overlay=/tmp/ovl/overlay.json -tags patchedstdlib

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Check Code Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Generate patched-stdlib overlay
        run: go run ./toolchain/mkoverlay -out /tmp/ovl

      - name: Run Tests (Linux)
        run: go test -v $PATCHFLAGS ./...

      - name: Run go vet
        run: go vet $PATCHFLAGS ./...

      - name: Cross-compile for ZTE Modem (ARMv5/ARMv7)
        run: GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 go build $PATCHFLAGS -trimpath -ldflags "-s -w" -o sms-relay .

      - name: Package Archive & Checksums
        run: |
          tar -czf sms-relay-linux-armv5.tar.gz sms-relay README.md LICENSE
          sha256sum sms-relay sms-relay-linux-armv5.tar.gz > checksums.txt

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sms-relay-release-assets
          path: |
            sms-relay
            sms-relay-linux-armv5.tar.gz
            checksums.txt

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: sms-relay-release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            sms-relay
            sms-relay-linux-armv5.tar.gz
            checksums.txt
